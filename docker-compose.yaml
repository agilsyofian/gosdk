name: go-project
services:

  postgres:
    container_name: go-postgres
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    volumes:
      - .data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=root

  redis:
    container_name: go-redis
    image: redis:latest
    ports:
      - "6379:6379"
    restart: always
    command:
      - redis-server
      - --save 60 1
      - --loglevel warning
    volumes:
      - .data/redis:/data

  redis-insight:
      container_name: go-redis-insight
      image: redis/redisinsight:latest
      ports:
        - "5540:5540"
      restart: always
      depends_on:
        - redis
      volumes:
        - .data/redisinsight:/data

  zookeeper:
    container_name: go-zookeeper
    image: confluentinc/cp-zookeeper:7.8.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - .data/zookeeper:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    container_name: go-kafka
    image: confluentinc/cp-kafka:7.8.0
    ports:
      - "9092:9092"
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_REPLICA_FETCHERS: 2
      KAFKA_REPLICA_LAG_TIME_MAX_MS: 5000
      KAFKA_CONTROLLED_SHUTDOWN_ENABLE: "true"

    volumes:
      - .data/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 3

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.8.0
    hostname: control-center
    container_name: go-control-center
    depends_on:
      - kafka
      - zookeeper
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:29092
      CONTROL_CENTER_ZOOKEEPER_CONNECT: zookeeper:2181

      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1

      CONTROL_CENTER_COMMAND_TOPIC_REPLICATION: 1
      CONTROL_CENTER_METRICS_TOPIC_REPLICATION: 1
      CONTROL_CENTER_STREAMS_NUM_STREAM_THREADS: 1

      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      CONFLUENT_METRICS_ENABLE: "false"

      PORT: 9021

  jaeger:
    container_name: go-jaeger
    image: jaegertracing/jaeger:latest   # Menggunakan Jaeger v2
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  minio:
    container_name: go-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - .data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    container_name: go-elasticsearch
    image: elasticsearch:8.16.0
    environment:
      - node.name=elasticsearch
      - cluster.name=go-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - .data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    container_name: go-kibana
    image: kibana:8.16.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  fluent-bit:
    container_name: go-fluent-bit
    image: fluent/fluent-bit:3.1
    ports:
      - "9880:9880"   # HTTP input
      - "24224:24224" # Forward input
      - "24224:24224/udp"
    volumes:
      - ./tools/observability/fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./tools/observability/fluentbit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - .data/logs:/var/log/app
    depends_on:
      - elasticsearch

  prometheus:
    container_name: go-prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./tools/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./tools/observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - .data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    container_name: go-grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./tools/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - .data/grafana:/var/lib/grafana
    depends_on:
      - prometheus