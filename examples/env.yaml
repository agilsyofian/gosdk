storage:
  cache:
    type: "standalone"
    addrs: ["localhost:6379"]
    username: ""
    password: ""
    db: 0
    tracing:
      enabled: true
    logger:
      enabled: true
  postgres:
    host: "localhost"
    port: 5432
    user: "root"
    password: "root"
    db_name: "postgres"
    ssl_mode: "disable"
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 10m
    conn_max_idle_time: 10m
    tracing:
      enabled: true
    logger:
      enabled: true
  objectstorage:
    endpoint: "localhost:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "example-bucket"
    use_ssl: false
    region: "us-east-1"
    auto_create_bucket: true
    logger:
      enabled: true

http_integrations:
  httpbin:
    server_name: "httpbin"
    base_url: "https://httpbin.org"
    timeout: "10s"
    retry:
      enabled: true
      max_attempts: 1
      delay: "1s"
    circuit_breaker:
      enabled: true
      name: "httpbin"
      min_requests: 10
      max_requests: 2
      interval: "10s"
      timeout: "10s"
      failure_rate: 0.5

grpc_integrations:
  user:
    server_name: "user"
    addr: "localhost:8081"
    timeout: "10s"
    retry:
      max_attempts: 1
      delay: "1s"
    circuit_breaker:
      name: "user"
      min_requests: 10
      max_requests: 2
      interval: "10s"
      timeout: "10s"
      failure_rate: 0.5
    authentication:
      type: "jwt"
      cache_ttl: 1h

client_interceptor:
  httpbin:
    username: "user"
    password: "password"

messaging:
  brokers: ["localhost:9092"]
  topics:
    user_event: "user.event"
    notification_event: "notification.event"
  producer:
  consumer:
    group_id: "example-consumer-group"
    concurrency: 1
    auto_offset_reset: "earliest"

