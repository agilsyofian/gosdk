app_name: "example"
app_version: "1.0.0"

server:
  http:
    base_path: "/example"
    addr: ":8001"
    read_timeout: "60s"
    write_timeout: "60s"
    idle_timeout: "120s"
    shutdown_timeout: "5s"
    shutdown_delay: "5s"
    mode: "debug"
    enable_cors: true
    cors:
      allow_origins:
        - "*"
      allow_methods:
        - "GET"
        - "POST"
        - "PUT"
        - "PATCH"
        - "DELETE"
        - "HEAD"
        - "OPTIONS"
      allow_headers:
        - "Origin"
        - "Content-Type"
        - "Accept"
        - "Authorization"
        - "X-Requested-With"
        - "X-Session-Id"
        - "X-Trace-Id"
        - "X-Request-Id"
        - "X-Idempotency-Key"
        - "X-Signature"
        - "X-Timestamp"
        - "X-Client-Id"
      expose_headers:
        - "Content-Length"
        - "X-Session-Id"
        - "X-Trace-Id"
        - "X-Request-Id"
        - "X-Cache-Lookup"
        - "X-Idempotent-Replayed"
        - "X-Signature"
        - "X-Timestamp"
      allow_credentials: false
      max_age: "12h"
    disable_block_method_override: false
    disable_block_special_chars: false
    allowed_special_chars_regex: "^[a-zA-Z0-9., '/_@:-]*$"
    security_headers:
      disabled: false
      hsts_max_age: "4320h"
      disable_hsts_subdomains: false
      disable_hsts_preload: false
      content_security_policy: "frame-ancestors 'none'"
      frame_options: "DENY"
      referrer_policy: "strict-origin-when-cross-origin"
      disable_no_cache: false
      sanitize_response: true
    idempotency:
      enabled: true
      ttl: "1m"
      lock_timeout: "10s"
      header_name: "X-Idempotency-Key"
    signature:
      enabled: true
      algorithm: "HMAC-SHA256"
      encoding: "hex"
      signature_header: "X-Signature"
      timestamp_header: "X-Timestamp"
      key_id_header: "X-Client-Id"
      max_clock_drift: "5m"
      sign_response: true
      response_signature_header: "X-Signature"
      response_timestamp_header: "X-Timestamp"
      secret: "example-secret-key-12345"
    metadata:
      trace_id_header: "X-Trace-Id"
      span_id_header: "X-Span-Id"
      request_id_header: "X-Request-Id"
      session_id_header: "X-Session-Id"
      user_id_header: "X-User-Id"
      capture_headers:
        - "X-Device-Id"
        - "X-App-Version"
        - "X-Tenant-Id"
    security:
      required: true
      enable_bearer: true
      enable_basic: false
      enable_api_key: true
      api_key_header: "X-API-Key"
      session_cookie: "SESSION_ID"
    enable_swagger: true
    show_error_detail: true
    logger_exclude_routes:
      - "/actuator"
      - "/favicon.ico"
    actuator:
      enabled: true
      path: "/actuator"
      health_path: "/health"
      info_path: "/info"
  grpc:
    addr: ":8081"
    reflection_enabled: true
    show_error_detail: true
    shutdown_timeout: "30s"
    max_concurrent_streams: 1000
    max_receive_message_size: 16777216 # 16MB
    max_send_message_size: 16777216 # 16MB
    connection_timeout: "120s"
    health_check_enabled: true
    keepalive:
      max_connection_idle: "15s"
      max_connection_age: "30s"
      max_connection_age_grace: "5s"
      time: "10s"
      timeout: "3s"
      min_time: "5s"
      permit_without_stream: true
    metadata:
      trace_id_header: "X-Trace-Id"
      request_id_header: "X-Request-Id"
      session_id_header: "X-Session-Id"
      user_id_header: "X-User-Id"
      capture_headers:
        - "X-Device-Id"
        - "X-Tenant-Id"
    security:
      required: true
      enable_bearer: true
      enable_basic: false
      enable_api_key: true
      api_key_metadata_key: "x-api-key"
      session_metadata_key: "x-session-id"

observability:
  logger:
    log_level: 0 # info
    output: "stdout"
    log_dir: ""
    filter_params: [password, pin, otp, token, authorization]
    max_length_param_value: 256
  tracer:
    enabled: true
    endpoint: "localhost:4317"
    sampler_ratio: 1.0

security:
  kid:
    signin: "sig_v1"
    encryption: "enc_v1"
  private_key:
    sig_v1: ""
    enc_v1: ""

  authenticators:
