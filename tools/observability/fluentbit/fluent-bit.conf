[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf

[INPUT]
    Name             tail
    Path             /var/log/app/*.log
    Parser           json
    Tag              app.log
    Read_from_Head   On
    Refresh_Interval 1
    Skip_Long_Lines  On

[INPUT]
    Name          http
    Listen        0.0.0.0
    Port          9880
    Tag           app.http

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    Tag           app.forward

[FILTER]
    Name          parser
    Match         app.http
    Key_Name      log
    Parser        json
    Reserve_Data  On

[OUTPUT]
    Name               es
    Match              *
    Host               elasticsearch
    Port               9200
    Index              gosdk-logs
    Type               _doc
    Suppress_Type_Name On
    Logstash_Format    On
    Logstash_Prefix    gosdk-logs
    Logstash_DateFormat %Y.%m.%d
    Trace_Error        On
    Retry_Limit        5
